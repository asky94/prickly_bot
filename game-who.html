<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Кто это написал?</title><link rel="stylesheet" href="shared.css">
    <style>
        body{background:transparent;padding:0}
        .phone-frame{box-shadow:none;border:none;border-radius:0;min-height:auto;max-width:100%}
        .header{display:none}
        .content{padding:20px 15px;gap:12px}
        .quote-box{background:var(--yellow);padding:15px;border-radius:20px;margin:10px 0;text-align:center}
    </style>
</head>
<body>
<div class="phone-frame">
<div class="toast" id="toast"></div>
<div class="content">
<div class="screen active" id="screen-who-guess">
    <h1>❓</h1>
    <h2>Кто это написал?</h2>
    <div class="quote-box">
        <p style="font-family:Arial,sans-serif;font-weight:900;font-size:20px;" id="who-quote">Загрузка...</p>
    </div>
    <div class="vote-grid" id="who-grid"></div>
    <button class="btn btn-primary btn-arial" id="guess-btn" onclick="guessWho()">🔍 Угадать</button>
</div>
<div class="screen" id="screen-waiting">
    <h1>⏳</h1>
    <h2>Ожидание...</h2>
    <p style="font-family:var(--marker);">Другие игроки угадывают</p>
    <div class="progress-doodle"><div class="progress-fill" id="waiting-progress" style="width:33%;"></div></div>
    <p style="font-family:var(--marker);font-size:14px;" id="waiting-text">Готово: 1/3</p>
</div>
<div class="screen" id="screen-results">
    <h1>🏆</h1>
    <h2>Результат!</h2>
    <p style="font-family:var(--marker);" id="result-text"></p>
    <button class="btn btn-primary btn-arial" id="btn-finish" onclick="finishGame()">▶ Следующий раунд</button>
    <button class="btn btn-secondary btn-arial" onclick="goToLobby()">← Назад в лобби</button>
</div>
</div>
</div>

<script>
var p = new URLSearchParams(window.location.search);
var SRV = p.get('server_url') || 'https://regroup-lucid-bronco.ngrok-free.dev';
var SID = p.get('session_id') || 'test-session';
var myId = p.get('user_id') || 'unknown';
var myName = p.get('username') || 'Игрок';
var H = {'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true'};

var whoQuote = '';
var whoCorrect = '';
var allPlayers = [];
var myGuess = null;
var roundFinished = false;
var waitingInterval = null;

async function loadGame() {
    try {
        var r = await fetch(SRV + '/api/state?session_id=' + SID, {
            headers: {'ngrok-skip-browser-warning': 'true'}
        });
        var state = await r.json();
        
        allPlayers = [];
        for (var uid in state.players) {
            allPlayers.push({
                id: uid,
                name: state.players[uid].username || uid,
                avatar: state.players[uid].avatar
            });
        }
        
        whoQuote = state.who_quote || 'Я никогда не просыпал работу';
    } catch(e) {
        allPlayers = [{id: 'p1', name: 'Саша'}, {id: 'p2', name: 'Маша'}, {id: 'p3', name: 'Дима'}];
        whoQuote = 'Я никогда не просыпал работу';
    }
    document.getElementById('who-quote').textContent = '«' + whoQuote + '»';
    renderCards();
}

function renderCards() {
    var grid = document.getElementById('who-grid');
    grid.innerHTML = '';
    
    var candidates = allPlayers.slice(0, 6);
    for (var i = 0; i < candidates.length; i++) {
        var p = candidates[i];
        
        var avatarHtml = p.avatar ?
            '<img src="' + p.avatar + '" style="width:70px;height:70px;border-radius:50%;object-fit:cover;border:3px solid var(--ink);margin-bottom:5px;">' :
            '<div style="width:70px;height:70px;border-radius:50%;background:#457B9D;display:flex;align-items:center;justify-content:center;font-size:30px;color:white;font-family:var(--marker);margin-bottom:5px;">' + (p.name || '?').substr(0, 2).toUpperCase() + '</div>';
        
        var card = document.createElement('div');
        card.className = 'vote-card';
        card.setAttribute('data-player', p.id);
        card.innerHTML = avatarHtml + '<p style="font-family:var(--marker);">' + escapeHtml(p.name) + '</p>';
        card.onclick = (function(id, name) {
            return function() { selectGuess(id, name); };
        })(p.id, p.name);
        
        grid.appendChild(card);
    }
}

function selectGuess(id, name) {
    document.querySelectorAll('#who-grid .vote-card').forEach(function(card) {
        card.classList.remove('selected');
    });
    
    var cards = document.querySelectorAll('#who-grid .vote-card');
    for (var i = 0; i < cards.length; i++) {
        if (cards[i].getAttribute('data-player') === id) {
            cards[i].classList.add('selected');
            break;
        }
    }
    
    myGuess = name;
    showToast('✅ Выбран: ' + name);
}

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(function(s) {
        s.classList.remove('active');
    });
    var t = document.getElementById('screen-' + id);
    if (t) {
        t.classList.add('active', 'bounce-in');
        setTimeout(function() { t.classList.remove('bounce-in'); }, 500);
    }
}

function showToast(m) {
    var t = document.getElementById('toast');
    t.textContent = m;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2500);
}

function goToLobby() {
    if (waitingInterval) clearInterval(waitingInterval);
    window.parent.postMessage({type: 'go-lobby'}, '*');
}

async function guessWho() {
    if (!myGuess) {
        showToast('⚠ Выбери игрока!');
        return;
    }
    
    var guessBtn = document.getElementById('guess-btn');
    guessBtn.disabled = true;
    guessBtn.textContent = '⏳ Отправка...';
    
    try {
        var res = await fetch(SRV + '/api/submit-who', {
            method: 'POST',
            headers: H,
            body: JSON.stringify({
                session_id: SID,
                user_id: myId,
                guessed: myGuess
            })
        });
        var data = await res.json();
        
        if (data.status === 'ok') {
            showToast('✅ Ответ отправлен!');
            showScreen('waiting');
            startWaitingForResults();
        } else {
            showToast('❌ Ошибка');
            guessBtn.disabled = false;
            guessBtn.textContent = '🔍 Угадать';
        }
    } catch(e) {
        console.error('Guess error:', e);
        showToast('❌ Ошибка соединения');
        guessBtn.disabled = false;
        guessBtn.textContent = '🔍 Угадать';
    }
}

function startWaitingForResults() {
    if (waitingInterval) clearInterval(waitingInterval);
    
    waitingInterval = setInterval(async function() {
        try {
            var res = await fetch(SRV + '/api/state?session_id=' + SID, {
                headers: {'ngrok-skip-browser-warning': 'true'}
            });
            var state = await res.json();
            
            var guessesCount = Object.keys(state.who_guesses || {}).length;
            var total = state.players_count || 3;
            var percent = Math.round(guessesCount / total * 100);
            
            document.getElementById('waiting-progress').style.width = percent + '%';
            document.getElementById('waiting-text').textContent = 'Готово: ' + guessesCount + '/' + total;
            
            if (state.phase === 'results') {
                clearInterval(waitingInterval);
                whoCorrect = state.who_correct || 'Неизвестный игрок';
                showResults(whoCorrect);
            }
        } catch(e) { console.error('Waiting poll error:', e); }
    }, 1500);
}

function showResults(correctPlayer) {
    var resultEl = document.getElementById('result-text');
    
    if (myGuess === correctPlayer) {
        resultEl.innerHTML = '✅ Правильно! Большинство считает, что это <b>' + escapeHtml(correctPlayer) + '</b>!<br>+2 очка';
        resultEl.style.color = 'var(--green)';
    } else {
        resultEl.innerHTML = '❌ Мимо! Большинство считает, что это <b>' + escapeHtml(correctPlayer) + '</b>!';
        resultEl.style.color = 'var(--red)';
    }
    
    showScreen('results');
}

function finishGame() {
    if (roundFinished) return;
    roundFinished = true;
    
    var finishBtn = document.getElementById('btn-finish');
    if (finishBtn) {
        finishBtn.disabled = true;
        finishBtn.textContent = '⏳ Ожидание...';
    }
    
    var scores = {};
    if (myGuess === whoCorrect && whoCorrect) {
        scores[myName] = 2;
    }
    
    window.parent.postMessage({type: 'game-complete', scores: scores}, '*');
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

window.addEventListener('DOMContentLoaded', function() {
    loadGame();
});
</script>
</body>
</html>
