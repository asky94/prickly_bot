<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Кто это написал?</title><link rel="stylesheet" href="shared.css">
    <style>body{background:transparent;padding:0}.phone-frame{box-shadow:none;border:none;border-radius:0;min-height:auto;max-width:100%}.header{display:none}.content{padding:20px 15px;gap:12px}</style>
</head>
<body>
<div class="phone-frame">
<div class="toast" id="toast"></div>
<div class="content">
<div class="screen active" id="screen-who-guess"><h1>❓</h1><h2>Кто это написал?</h2><p class="doodle-text" style="font-family:Arial,sans-serif;font-weight:900;" id="who-quote">Загрузка...</p><div class="vote-grid" id="who-grid"></div><button class="btn btn-primary btn-arial" onclick="guessWho()">🔍 Угадать</button></div>
<div class="screen" id="screen-waiting"><h1>⏳</h1><h2>Ожидание...</h2><p style="font-family:var(--marker);">Другие игроки угадывают</p><div class="progress-doodle"><div class="progress-fill" id="waiting-progress" style="width:33%;"></div></div><p style="font-family:var(--marker);font-size:14px;" id="waiting-text">Готово: 1/3</p></div>
<div class="screen" id="screen-results"><h1>🏆</h1><h2>Результат!</h2><p id="result-text" style="font-family:var(--marker);"></p><button class="btn btn-primary btn-arial" id="btn-finish" onclick="finishGame()">▶ Следующий раунд</button><button class="btn btn-secondary btn-arial" onclick="goToLobby()">← Назад в лобби</button></div>
</div>
</div>
<script>
var p=new URLSearchParams(window.location.search);
var SRV=p.get('server_url')||'https://regroup-lucid-bronco.ngrok-free.dev';
var SID=p.get('session_id')||'test-session';
var myId=p.get('user_id')||'unknown';
var myName=p.get('username')||'Игрок';
var H={'Content-Type':'application/json','ngrok-skip-browser-warning':'true'};

var whoQuote='',whoCorrect='',allPlayers=[],myGuess=null,roundVoted=false;
async function loadGame(){
    try{
        var r=await fetch(SRV+'/api/state?session_id='+SID,{headers:{'ngrok-skip-browser-warning':'true'}});
        var state=await r.json();
        allPlayers=[];
        for(var uid in state.players){
            allPlayers.push({id:uid,name:state.players[uid].username||uid,avatar:state.players[uid].avatar});
        }
        whoQuote=state.who_quote||'Я никогда не просыпал работу';
    }catch(e){
        allPlayers=[{id:'p1',name:'Саша'},{id:'p2',name:'Маша'},{id:'p3',name:'Дима'}];
    }
    document.getElementById('who-quote').textContent='«'+whoQuote+'»';
    renderCards();
}
function renderCards(){var g=document.getElementById('who-grid');g.innerHTML='';var candidates=allPlayers.slice(0,4);for(var i=0;i<candidates.length;i++){var p=candidates[i];var avatarHtml=p.avatar?'<img src="'+p.avatar+'" style="width:70px;height:70px;border-radius:50%;object-fit:cover;border:3px solid var(--ink);margin-bottom:5px;">':'<div style="width:70px;height:70px;border-radius:50%;background:#457B9D;display:flex;align-items:center;justify-content:center;font-size:30px;color:white;font-family:var(--marker);margin-bottom:5px;">'+(p.name||'?').substr(0,2).toUpperCase()+'</div>';g.innerHTML+='<div class="vote-card" data-player="'+p.id+'" data-name="'+p.name+'" onclick="selectGuess(this,\''+p.id+'\',\''+p.name+'\')">'+avatarHtml+'<p style="font-family:var(--marker);">'+p.name+'</p></div>';}}
function selectGuess(card,id,name){document.querySelectorAll('#who-grid .vote-card').forEach(function(c){c.classList.remove('selected');});card.classList.add('selected');myGuess=name;}
function showScreen(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});var t=document.getElementById('screen-'+id);if(t){t.classList.add('active','bounce-in');setTimeout(function(){t.classList.remove('bounce-in');},500);}}
function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}
function goToLobby(){window.parent.postMessage({type:'go-lobby'},'*');}
async function guessWho(){if(!myGuess){showToast('⚠ Выбери!');return;}await fetch(SRV+'/api/submit-who',{method:'POST',headers:H,body:JSON.stringify({session_id:SID,user_id:myId,guessed:myGuess})});showScreen('waiting');checkResults();}
async function checkResults(){var iv=setInterval(async function(){var res=await fetch(SRV+'/api/state?session_id='+SID,{headers:{'ngrok-skip-browser-warning':'true'}});var state=await res.json();var up=Object.keys(state.who_guesses||{}).length,total=state.players_count||3;document.getElementById('waiting-progress').style.width=Math.round(up/total*100)+'%';document.getElementById('waiting-text').textContent='Готово: '+up+'/'+total;if(state.phase==='results'){clearInterval(iv);whoCorrect=state.who_correct||'Неизвестный игрок';var el=document.getElementById('result-text');if(myGuess===whoCorrect){el.innerHTML='✅ Правильно! Большинство считает, что это <b>'+whoCorrect+'</b>!<br>+2 очка';el.style.color='var(--green)';}else{el.innerHTML='❌ Мимо! Большинство считает, что это <b>'+whoCorrect+'</b>!';el.style.color='var(--red)';}showScreen('results');}},1000);}
function finishGame(){if(roundVoted)return;roundVoted=true;document.getElementById('btn-finish').disabled=true;document.getElementById('btn-finish').textContent='⏳ Ожидание...';var scores={};if(myGuess===whoCorrect)scores[myName]=2;window.parent.postMessage({type:'game-complete',scores:scores},'*');}
window.addEventListener('DOMContentLoaded',function(){loadGame();});
</script>
</body>
</html>
