<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Фото-задание</title><link rel="stylesheet" href="shared.css">
    <style>body{background:transparent;padding:0}.phone-frame{box-shadow:none;border:none;border-radius:0;min-height:auto;max-width:100%}.header{display:none}.content{padding:15px 12px;gap:10px}#camera-input{display:none}.vote-img{width:100%;height:160px;object-fit:cover;border-radius:10px;cursor:pointer}</style>
</head>
<body>
<div class="phone-frame">
<div class="toast" id="toast"></div>
<div class="content">
<div class="screen active" id="screen-photo-task"><h1>📸</h1><h2>Фото-задание!</h2><p class="doodle-text" style="font-family:Arial,sans-serif;font-weight:900;" id="task-text">Загрузка...</p><div class="photo-upload-area" onclick="document.getElementById('camera-input').click()" style="width:160px;height:160px;">📷<br>Сделать фото</div><input type="file" id="camera-input" accept="image/*" capture="environment" onchange="handlePhotoUpload(event)"><img class="photo-preview" id="photo-preview" style="display:none;width:160px;height:160px;" alt="Превью"><p id="photo-status" style="font-family:var(--marker);color:var(--green);">Ожидаем...</p><button class="btn btn-secondary btn-small btn-arial" id="btn-to-vote" style="display:none;" onclick="showVoting()">→ К голосованию</button></div>
<div class="screen" id="screen-waiting"><h1>⏳</h1><h2>Ожидание...</h2><p style="font-family:var(--marker);">Другие игроки загружают фото</p><div class="progress-doodle"><div class="progress-fill" id="waiting-progress" style="width:33%;"></div></div><p style="font-family:var(--marker);font-size:14px;" id="waiting-text">Готово: 1/3</p></div>
<div class="screen" id="screen-vote"><h1>🗳</h1><h2>Голосование!</h2><p style="font-family:Arial,sans-serif;font-weight:900;">Чьё фото лучше?</p><div class="vote-grid" id="vote-grid"></div><button class="btn btn-primary btn-arial" onclick="submitVote()">→ К результатам</button></div>
<div class="screen" id="screen-results"><h1>🏆</h1><h2>Результаты!</h2><div id="winner-photo-container" style="width:180px;height:180px;margin:8px auto;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);border:var(--border);background:white;"><img id="winner-photo" src="" alt="Победитель" style="width:100%;height:100%;object-fit:cover;display:none;"><div id="winner-placeholder" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:50px;background:#ddd;"></div></div><div id="round-results" style="text-align:left;width:100%;font-family:var(--marker);"></div><button class="btn btn-primary btn-arial" id="btn-finish" onclick="finishGame()">▶ Следующий раунд</button><button class="btn btn-secondary btn-arial" onclick="goToLobby()">← Назад в лобби</button></div>
</div>
</div>
<div class="photo-modal" id="photo-modal"><img class="photo-modal-image" id="photo-modal-img" src="" alt="Превью"><div class="photo-modal-buttons"><div class="photo-modal-btn back" onclick="closePhotoModal()">↩ НАЗАД</div><div class="photo-modal-btn" onclick="confirmVote()">✅ ВЫБРАТЬ</div></div></div>
<script>
var p=new URLSearchParams(window.location.search);
var SRV=p.get('server_url')||'https://regroup-lucid-bronco.ngrok-free.dev';
var SID=p.get('session_id')||'test-session';
var myId=p.get('user_id')||'unknown';
var myName=p.get('username')||'Игрок';
var H={'Content-Type':'application/json','ngrok-skip-browser-warning':'true'};

var taskText='',photoUploaded=false,myPhotoData=null,selectedVote=null,previewPlayer=null,allPhotos={},players={},timer=null,deadline=1800,roundVoted=false;
async function loadTask(){
    try{
        var r=await fetch(SRV+'/api/task?session_id='+SID+'&game_type=photo&user_id='+myId,{headers:{'ngrok-skip-browser-warning':'true'}});
        var d=await r.json();
        taskText=d.task||'Сделай фото!';
    }catch(e){
        taskText='Сделай фото!';
    }
    document.getElementById('task-text').textContent='«'+taskText+'»';
}
function showScreen(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});var t=document.getElementById('screen-'+id);if(t){t.classList.add('active','bounce-in');setTimeout(function(){t.classList.remove('bounce-in');},500);}}
function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}
function goToLobby(){if(timer)clearInterval(timer);window.parent.postMessage({type:'go-lobby'},'*');}
function startTimer(){deadline=1800;timer=setInterval(function(){deadline--;if(deadline<=0){clearInterval(timer);document.getElementById('btn-to-vote').style.display='inline-block';}},1000);}
function handlePhotoUpload(event){var f=event.target.files[0];if(!f)return;var r=new FileReader();r.onload=async function(e){myPhotoData=e.target.result;document.getElementById('photo-preview').src=myPhotoData;document.getElementById('photo-preview').style.display='block';document.getElementById('photo-upload-area').style.display='none';document.getElementById('photo-status').textContent='✅ Загружаем...';try{await fetch(SRV+'/api/upload-photo',{method:'POST',headers:H,body:JSON.stringify({session_id:SID,user_id:myId,image:myPhotoData})});document.getElementById('photo-status').textContent='✅ Загружено!';photoUploaded=true;showScreen('waiting');checkUploads();}catch(er){document.getElementById('photo-status').textContent='❌ Ошибка';}};r.readAsDataURL(f);}
async function checkUploads(){var iv=setInterval(async function(){var res=await fetch(SRV+'/api/state?session_id='+SID,{headers:{'ngrok-skip-browser-warning':'true'}});var state=await res.json();var photos=state.photos||{};players=state.players||{};var up=Object.keys(photos).length,total=state.players_count||3;document.getElementById('waiting-progress').style.width=Math.round(up/total*100)+'%';document.getElementById('waiting-text').textContent='Готово: '+up+'/'+total;if(state.phase==='voting'||up>=total){clearInterval(iv);allPhotos=photos;document.getElementById('btn-to-vote').style.display='inline-block';showScreen('photo-task');showToast('✅ Все загрузили!');}},2000);}
function showVoting(){if(timer)clearInterval(timer);renderVoteGrid();showScreen('vote');}
function renderVoteGrid(){var g=document.getElementById('vote-grid');g.innerHTML='';var keys=Object.keys(allPhotos);for(var i=0;i<keys.length;i++){var uid=keys[i],p=allPhotos[uid],name=p.username||uid;var imgHtml=p.image?'<img src="'+p.image+'" class="vote-img" onclick="openPhotoModal(\''+uid+'\',\''+name+'\')">':'<div class="vote-img" style="background:#ddd;display:flex;align-items:center;justify-content:center;font-size:50px;">📷</div>';g.innerHTML+='<div class="vote-card" data-player="'+uid+'">'+imgHtml+'<p style="font-family:var(--marker);margin:4px 0;font-size:13px;">'+name+'</p></div>';}}
function openPhotoModal(uid,name){previewPlayer=uid;var p=allPhotos[uid];var img=document.getElementById('photo-modal-img');img.src=p&&p.image?p.image:'';document.getElementById('photo-modal').classList.add('active');}
function closePhotoModal(){document.getElementById('photo-modal').classList.remove('active');previewPlayer=null;}
function confirmVote(){if(previewPlayer){document.querySelectorAll('.vote-card').forEach(function(c){c.classList.remove('selected');if(c.dataset.player===previewPlayer)c.classList.add('selected');});selectedVote=previewPlayer;showToast('Выбран '+allPhotos[previewPlayer]?.username||previewPlayer);}closePhotoModal();}
async function submitVote(){if(!selectedVote){showToast('⚠ Выбери!');return;}var res=await fetch(SRV+'/api/vote',{method:'POST',headers:H,body:JSON.stringify({session_id:SID,user_id:myId,voted_for:selectedVote,game:'photo'})});var data=await res.json();if(data.status==='error'){showToast('⚠ '+data.message);return;}if(data.all_voted){showResults(data.winner_name);}else{showToast('✅ Выбор сделан! Ожидаем других...');var ci=setInterval(async function(){var sr=await fetch(SRV+'/api/state?session_id='+SID,{headers:{'ngrok-skip-browser-warning':'true'}});var s=await sr.json();if(s.all_voted||s.phase==='results'){clearInterval(ci);showResults(s.winner_name);}},1500);}}
function showResults(winnerName){var displayName=winnerName||'Неизвестный игрок';var wp=allPhotos[displayName]||Object.values(allPhotos).find(function(p){return p.username===displayName;});var wi=document.getElementById('winner-photo');if(wp&&wp.image)wi.src=wp.image;else{var c=document.createElement('canvas');c.width=400;c.height=400;var ctx=c.getContext('2d');ctx.fillStyle='#FFD700';ctx.fillRect(0,0,400,400);ctx.font='150px Arial';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText('👑',200,200);wi.src=c.toDataURL();}wi.style.display='block';document.getElementById('winner-placeholder').style.display='none';document.getElementById('round-results').innerHTML='<p>🥇 <b>'+displayName+'</b> — 5 очков</p>';showScreen('results');}
function finishGame(){if(roundVoted)return;roundVoted=true;document.getElementById('btn-finish').disabled=true;document.getElementById('btn-finish').textContent='⏳ Ожидание...';var scores={};var wp=allPhotos[selectedVote];if(wp)scores[wp.username||selectedVote]=5;window.parent.postMessage({type:'game-complete',scores:scores},'*');}
window.addEventListener('DOMContentLoaded',async function(){await loadTask();startTimer();});
</script>
</body>
</html>
