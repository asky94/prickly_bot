<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Фото-задание</title><link rel="stylesheet" href="shared.css">
    <style>
        body{background:transparent;padding:0}
        .phone-frame{box-shadow:none;border:none;border-radius:0;min-height:auto;max-width:100%}
        .header{display:none}
        .content{padding:15px 12px;gap:10px}
        #camera-input{display:none}
        .vote-img{width:100%;height:160px;object-fit:cover;border-radius:10px;cursor:pointer}
        .photo-upload-area{width:160px;height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f0f0f0;border:4px dashed var(--ink);border-radius:20px;cursor:pointer;font-family:var(--marker);font-size:16px;text-align:center}
        .photo-preview{width:160px;height:160px;border-radius:20px;object-fit:cover;border:var(--border)}
    </style>
</head>
<body>
<div class="phone-frame">
<div class="toast" id="toast"></div>
<div class="content">
<div class="screen active" id="screen-photo-task">
    <h1>📸</h1>
    <h2>Фото-задание!</h2>
    <p class="doodle-text" style="font-family:Arial,sans-serif;font-weight:900;" id="task-text">Загрузка...</p>
    <div class="photo-upload-area" id="upload-area" onclick="document.getElementById('camera-input').click()">
        📷<br>Сделать фото
    </div>
    <input type="file" id="camera-input" accept="image/*" capture="environment" onchange="handlePhotoUpload(event)">
    <img class="photo-preview" id="photo-preview" style="display:none;" alt="Превью">
    <p id="photo-status" style="font-family:var(--marker);color:var(--green);">Ожидаем...</p>
</div>
<div class="screen" id="screen-waiting">
    <h1>⏳</h1>
    <h2>Ожидание...</h2>
    <p style="font-family:var(--marker);">Другие игроки загружают фото</p>
    <div class="progress-doodle"><div class="progress-fill" id="waiting-progress" style="width:33%;"></div></div>
    <p style="font-family:var(--marker);font-size:14px;" id="waiting-text">Готово: 1/3</p>
</div>
<div class="screen" id="screen-vote">
    <h1>🗳</h1>
    <h2>Голосование!</h2>
    <p style="font-family:Arial,sans-serif;font-weight:900;">Чьё фото лучше?</p>
    <div class="vote-grid" id="vote-grid"></div>
    <button class="btn btn-primary btn-arial" id="vote-btn" onclick="submitVote()">✅ Голосовать</button>
</div>
<div class="screen" id="screen-results">
    <h1>🏆</h1>
    <h2>Результаты!</h2>
    <div id="winner-photo-container" style="width:180px;height:180px;margin:8px auto;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);border:var(--border);background:white;">
        <img id="winner-photo" src="" alt="Победитель" style="width:100%;height:100%;object-fit:cover;display:none;">
        <div id="winner-placeholder" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:50px;background:#ddd;">👑</div>
    </div>
    <div id="round-results" style="text-align:left;width:100%;font-family:var(--marker);"></div>
    <button class="btn btn-primary btn-arial" id="btn-finish" onclick="finishGame()">▶ Следующий раунд</button>
    <button class="btn btn-secondary btn-arial" onclick="goToLobby()">← Назад в лобби</button>
</div>
</div>
</div>
<div class="photo-modal" id="photo-modal">
    <img class="photo-modal-image" id="photo-modal-img" src="" alt="Превью">
    <div class="photo-modal-buttons">
        <div class="photo-modal-btn back" onclick="closePhotoModal()">↩ НАЗАД</div>
        <div class="photo-modal-btn" onclick="confirmVote()">✅ ВЫБРАТЬ</div>
    </div>
</div>

<script>
var p = new URLSearchParams(window.location.search);
var SRV = p.get('server_url') || (() => { 
    var ref = document.referrer; 
    var match = ref.match(/server_url=([^&]+)/);
    return match ? decodeURIComponent(match[1]) : 'https://regroup-lucid-bronco.ngrok-free.dev';
})();
var SID = p.get('session_id') || 'test-session';
var myId = p.get('user_id') || 'unknown';
var myName = p.get('username') || 'Игрок';
var H = {'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true'};

var taskText = '';
var myPhotoData = null;
var selectedVote = null;
var allPhotos = {};
var players = {};
var roundFinished = false;
var waitingInterval = null;

async function loadTask() {
    try {
        var r = await fetch(SRV + '/api/task?session_id=' + SID + '&game_type=photo&user_id=' + myId, {
            headers: {'ngrok-skip-browser-warning': 'true'}
        });
        var d = await r.json();
        taskText = d.task || 'Сделай креативное селфи!';
    } catch(e) {
        taskText = 'Сделай креативное селфи!';
    }
    document.getElementById('task-text').textContent = '«' + taskText + '»';
}

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(function(s) {
        s.classList.remove('active');
    });
    var t = document.getElementById('screen-' + id);
    if (t) {
        t.classList.add('active', 'bounce-in');
        setTimeout(function() { t.classList.remove('bounce-in'); }, 500);
    }
}

function showToast(m) {
    var t = document.getElementById('toast');
    t.textContent = m;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2500);
}

function goToLobby() {
    if (waitingInterval) clearInterval(waitingInterval);
    window.parent.postMessage({type: 'go-lobby'}, '*');
}

async function handlePhotoUpload(event) {
    var f = event.target.files[0];
    if (!f) return;
    
    var r = new FileReader();
    r.onload = async function(e) {
        myPhotoData = e.target.result;
        document.getElementById('photo-preview').src = myPhotoData;
        document.getElementById('photo-preview').style.display = 'block';
        document.getElementById('upload-area').style.display = 'none';
        document.getElementById('photo-status').textContent = '📤 Загружаем...';
        
        try {
            var res = await fetch(SRV + '/api/upload-photo', {
                method: 'POST',
                headers: H,
                body: JSON.stringify({
                    session_id: SID,
                    user_id: myId,
                    image: myPhotoData
                })
            });
            var data = await res.json();
            
            if (data.status === 'ok') {
                document.getElementById('photo-status').textContent = '✅ Загружено! Ожидаем других...';
                showToast('✅ Фото отправлено!');
                showScreen('waiting');
                startWaitingForUploads();
            } else {
                document.getElementById('photo-status').textContent = '❌ Ошибка загрузки';
                showToast('❌ Ошибка, попробуй ещё раз');
            }
        } catch(er) {
            console.error('Upload error:', er);
            document.getElementById('photo-status').textContent = '❌ Ошибка соединения';
            showToast('❌ Ошибка соединения');
        }
    };
    r.readAsDataURL(f);
}

function startWaitingForUploads() {
    if (waitingInterval) clearInterval(waitingInterval);
    
    waitingInterval = setInterval(async function() {
        try {
            var res = await fetch(SRV + '/api/state?session_id=' + SID, {
                headers: {'ngrok-skip-browser-warning': 'true'}
            });
            var state = await res.json();
            
            var photos = state.photos || {};
            var uploadedCount = Object.keys(photos).length;
            var total = state.players_count || 3;
            var percent = Math.round(uploadedCount / total * 100);
            
            document.getElementById('waiting-progress').style.width = percent + '%';
            document.getElementById('waiting-text').textContent = 'Готово: ' + uploadedCount + '/' + total;
            
            if (state.phase === 'voting' || uploadedCount >= total) {
                clearInterval(waitingInterval);
                allPhotos = photos;
                players = state.players || {};
                renderVoteGrid();
                showScreen('vote');
            }
        } catch(e) {
            console.error('Waiting poll error:', e);
        }
    }, 1500);
}

function renderVoteGrid() {
    var grid = document.getElementById('vote-grid');
    grid.innerHTML = '';
    
    var keys = Object.keys(allPhotos);
    if (keys.length === 0) {
        grid.innerHTML = '<p style="font-family:var(--marker);text-align:center;">Нет фото для голосования</p>';
        return;
    }
    
    for (var i = 0; i < keys.length; i++) {
        var uid = keys[i];
        var p = allPhotos[uid];
        var name = p.username || uid;
        var isSelf = (uid === myId);
        
        var card = document.createElement('div');
        card.className = 'vote-card';
        card.setAttribute('data-player', uid);
        card.style.cursor = isSelf ? 'not-allowed' : 'pointer';
        card.style.opacity = isSelf ? '0.6' : '1';
        
        var imgHtml = p.image ? 
            '<img src="' + p.image + '" class="vote-img" onclick="event.stopPropagation();openPhotoModal(\'' + uid + '\')">' : 
            '<div class="vote-img" style="background:#ddd;display:flex;align-items:center;justify-content:center;font-size:50px;">📷</div>';
        
        card.innerHTML = imgHtml + '<p style="font-family:var(--marker);margin:4px 0;font-size:13px;">' + escapeHtml(name) + '</p>';
        
        if (!isSelf) {
            card.onclick = (function(id) { 
                return function() { selectVote(id); };
            })(uid);
        }
        
        grid.appendChild(card);
    }
}

function selectVote(uid) {
    document.querySelectorAll('#vote-grid .vote-card').forEach(function(card) {
        card.classList.remove('selected');
    });
    
    var cards = document.querySelectorAll('#vote-grid .vote-card');
    for (var i = 0; i < cards.length; i++) {
        if (cards[i].getAttribute('data-player') === uid) {
            cards[i].classList.add('selected');
            break;
        }
    }
    
    selectedVote = uid;
    showToast('✅ Выбрано фото ' + (allPhotos[uid]?.username || uid));
}

function openPhotoModal(uid) {
    var p = allPhotos[uid];
    if (p && p.image) {
        document.getElementById('photo-modal-img').src = p.image;
        document.getElementById('photo-modal').classList.add('active');
    }
}

function closePhotoModal() {
    document.getElementById('photo-modal').classList.remove('active');
}

function confirmVote() {
    if (previewPlayerUid) {
        selectVote(previewPlayerUid);
        previewPlayerUid = null;
    }
    closePhotoModal();
}

var previewPlayerUid = null;

async function submitVote() {
    if (!selectedVote) {
        showToast('⚠ Выбери лучшее фото!');
        return;
    }
    
    var voteBtn = document.getElementById('vote-btn');
    voteBtn.disabled = true;
    voteBtn.textContent = '⏳ Отправка...';
    
    try {
        var res = await fetch(SRV + '/api/vote', {
            method: 'POST',
            headers: H,
            body: JSON.stringify({
                session_id: SID,
                user_id: myId,
                voted_for: selectedVote,
                game: 'photo'
            })
        });
        var data = await res.json();
        
        if (data.status === 'error') {
            showToast('⚠ ' + (data.message || 'Ошибка'));
            voteBtn.disabled = false;
            voteBtn.textContent = '✅ Голосовать';
            return;
        }
        
        showToast('✅ Голос учтён!');
        
        if (data.all_voted || data.phase === 'results') {
            await waitForWinner();
        } else {
            voteBtn.textContent = '⏳ Ожидание результатов...';
            await waitForWinner();
        }
    } catch(e) {
        console.error('Vote error:', e);
        showToast('❌ Ошибка');
        voteBtn.disabled = false;
        voteBtn.textContent = '✅ Голосовать';
    }
}

async function waitForWinner() {
    var interval = setInterval(async function() {
        try {
            var res = await fetch(SRV + '/api/state?session_id=' + SID, {
                headers: {'ngrok-skip-browser-warning': 'true'}
            });
            var state = await res.json();
            
            if (state.phase === 'results' && state.winner_name) {
                clearInterval(interval);
                showResults(state.winner_name);
            }
        } catch(e) { console.error('Results poll error:', e); }
    }, 1500);
}

function showResults(winnerName) {
    var displayName = winnerName || 'Неизвестный игрок';
    
    // Находим фото победителя
    var winnerPhoto = null;
    for (var uid in allPhotos) {
        if (allPhotos[uid].username === winnerName) {
            winnerPhoto = allPhotos[uid].image;
            break;
        }
    }
    
    var winnerImg = document.getElementById('winner-photo');
    if (winnerPhoto) {
        winnerImg.src = winnerPhoto;
        winnerImg.style.display = 'block';
        document.getElementById('winner-placeholder').style.display = 'none';
    } else {
        winnerImg.style.display = 'none';
        document.getElementById('winner-placeholder').style.display = 'flex';
    }
    
    document.getElementById('round-results').innerHTML = '<p>🥇 <b>' + escapeHtml(displayName) + '</b> — 5 очков</p>';
    showScreen('results');
}

function finishGame() {
    if (roundFinished) return;
    roundFinished = true;
    
    var finishBtn = document.getElementById('btn-finish');
    if (finishBtn) {
        finishBtn.disabled = true;
        finishBtn.textContent = '⏳ Ожидание...';
    }
    
    var winnerName = document.getElementById('round-results').innerText.match(/🥇 (.+?) —/)?.[1] || '';
    var scores = {};
    if (winnerName) {
        scores[winnerName] = 5;
    }
    
    window.parent.postMessage({type: 'game-complete', scores: scores}, '*');
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

window.addEventListener('DOMContentLoaded', async function() {
    await loadTask();
});
</script>
</body>
</html>
