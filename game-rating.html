<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Рейтинг</title><link rel="stylesheet" href="shared.css">
    <style>
        body{background:transparent;padding:0}
        .phone-frame{box-shadow:none;border:none;border-radius:0;min-height:auto;max-width:100%}
        .header{display:none}
        .content{padding:20px 15px;gap:12px}
        .draggable-list{list-style:none;padding:0;width:100%}
        .draggable-item{background:white;border:var(--border);border-radius:12px;padding:12px 15px;margin-bottom:8px;display:flex;align-items:center;gap:10px;font-family:var(--marker);box-shadow:2px 2px 0 rgba(0,0,0,0.1);user-select:none;touch-action:none;cursor:grab}
        .draggable-item:active{cursor:grabbing}
        .drag-handle{font-size:24px;margin-right:5px;cursor:grab}
        .rating-position{font-size:14px;font-weight:bold;background:var(--yellow);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink)}
        .player-avatar-small{width:35px;height:35px;border-radius:50%;object-fit:cover;border:2px solid var(--ink);background:var(--blue);display:flex;align-items:center;justify-content:center;color:white;font-family:var(--marker);font-size:16px;overflow:hidden}
    </style>
</head>
<body>
<div class="phone-frame">
<div class="toast" id="toast"></div>
<div class="content">
<div class="screen active" id="screen-rating-task">
    <h1>📊</h1>
    <h2>Расставь друзей!</h2>
    <p style="font-family:Arial,sans-serif;font-weight:900;" id="rating-prompt">От самого щедрого до самого жадины:</p>
    <ul class="draggable-list" id="rating-list"></ul>
    <button class="btn btn-primary btn-arial" id="submit-btn" onclick="submitRating()">✅ Готово</button>
</div>
<div class="screen" id="screen-waiting">
    <h1>⏳</h1>
    <h2>Ожидание...</h2>
    <p style="font-family:var(--marker);">Другие игроки расставляют</p>
    <div class="progress-doodle"><div class="progress-fill" id="waiting-progress" style="width:33%;"></div></div>
    <p style="font-family:var(--marker);font-size:14px;" id="waiting-text">Готово: 1/3</p>
</div>
<div class="screen" id="screen-results">
    <h1>🏆</h1>
    <h2>Результат!</h2>
    <div id="rating-results" style="font-family:var(--marker);text-align:left;width:100%;"></div>
    <button class="btn btn-primary btn-arial" id="btn-finish" onclick="finishGame()">▶ Следующий раунд</button>
    <button class="btn btn-secondary btn-arial" onclick="goToLobby()">← Назад в лобби</button>
</div>
</div>
</div>

<script>
var p = new URLSearchParams(window.location.search);
var SRV = p.get('server_url') || 'https://regroup-lucid-bronco.ngrok-free.dev';
var SID = p.get('session_id') || 'test-session';
var myId = p.get('user_id') || 'unknown';
var myName = p.get('username') || 'Игрок';
var H = {'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true'};

var allPlayers = [];
var criteria = 'щедрого';
var opposite = 'жадины';
var roundFinished = false;
var waitingInterval = null;
var ratingSubmitted = false;

async function loadGame() {
    try {
        var r = await fetch(SRV + '/api/state?session_id=' + SID, {
            headers: {'ngrok-skip-browser-warning': 'true'}
        });
        var state = await r.json();
        
        allPlayers = [];
        for (var uid in state.players) {
            allPlayers.push({
                id: uid,
                name: state.players[uid].username || uid,
                avatar: state.players[uid].avatar
            });
        }
        
        criteria = state.rating_criteria || 'щедрого';
        opposite = criteria === 'щедрого' ? 'жадины' : 'скучного';
    } catch(e) {
        allPlayers = [{id: 'p1', name: 'Саша'}, {id: 'p2', name: 'Маша'}, {id: 'p3', name: 'Дима'}];
        criteria = 'щедрого';
        opposite = 'жадины';
    }
    
    document.getElementById('rating-prompt').textContent = 'От самого ' + criteria + ' до самого ' + opposite + ':';
    renderList();
}

function renderList() {
    var list = document.getElementById('rating-list');
    list.innerHTML = '';
    
    for (var i = 0; i < allPlayers.length; i++) {
        var p = allPlayers[i];
        var avatarHtml = p.avatar ?
            '<img src="' + p.avatar + '" class="player-avatar-small" alt="' + escapeHtml(p.name) + '">' :
            '<div class="player-avatar-small">' + (p.name || '?').substr(0, 2).toUpperCase() + '</div>';
        
        var li = document.createElement('li');
        li.className = 'draggable-item';
        li.setAttribute('data-index', i);
        li.setAttribute('data-id', p.id);
        li.innerHTML = '<span class="rating-position">' + (i + 1) + '</span>' +
                       '<span class="drag-handle">⋮⋮</span>' +
                       avatarHtml +
                       '<span>' + escapeHtml(p.name) + '</span>';
        list.appendChild(li);
    }
    
    setupDragAndDrop();
}

function setupDragAndDrop() {
    var list = document.getElementById('rating-list');
    var draggedItem = null;
    var startY = 0;
    
    var items = list.querySelectorAll('.draggable-item');
    
    items.forEach(function(item) {
        item.addEventListener('dragstart', function(e) {
            e.preventDefault();
            return false;
        });
        
        item.addEventListener('mousedown', function(e) {
            if (e.target.classList.contains('drag-handle') || e.target.parentElement?.classList.contains('drag-handle')) {
                draggedItem = this;
                startY = e.clientY;
                this.style.opacity = '0.6';
                e.preventDefault();
            }
        });
        
        item.addEventListener('touchstart', function(e) {
            if (e.target.classList.contains('drag-handle') || e.target.parentElement?.classList.contains('drag-handle')) {
                draggedItem = this;
                startY = e.touches[0].clientY;
                this.style.opacity = '0.6';
                e.preventDefault();
            }
        });
    });
    
    document.addEventListener('mousemove', function(e) {
        if (!draggedItem) return;
        var diff = e.clientY - startY;
        if (Math.abs(diff) > 20) {
            swapItems(draggedItem, diff);
            startY = e.clientY;
        }
    });
    
    document.addEventListener('touchmove', function(e) {
        if (!draggedItem) return;
        var diff = e.touches[0].clientY - startY;
        if (Math.abs(diff) > 20) {
            swapItems(draggedItem, diff);
            startY = e.touches[0].clientY;
        }
    });
    
    document.addEventListener('mouseup', function() {
        if (draggedItem) {
            draggedItem.style.opacity = '';
            draggedItem = null;
        }
    });
    
    document.addEventListener('touchend', function() {
        if (draggedItem) {
            draggedItem.style.opacity = '';
            draggedItem = null;
        }
    });
}

function swapItems(item, diff) {
    var list = document.getElementById('rating-list');
    var items = [].slice.call(list.querySelectorAll('.draggable-item'));
    var currentIndex = items.indexOf(item);
    var targetIndex;
    
    if (diff > 0 && currentIndex < items.length - 1) {
        targetIndex = currentIndex + 1;
    } else if (diff < 0 && currentIndex > 0) {
        targetIndex = currentIndex - 1;
    } else {
        return;
    }
    
    var target = items[targetIndex];
    
    if (diff > 0) {
        list.insertBefore(item, target.nextSibling);
    } else {
        list.insertBefore(item, target);
    }
    
    // Обновляем массив
    var temp = allPlayers[currentIndex];
    allPlayers[currentIndex] = allPlayers[targetIndex];
    allPlayers[targetIndex] = temp;
    
    updatePositions();
}

function updatePositions() {
    var items = document.querySelectorAll('#rating-list .draggable-item');
    for (var i = 0; i < items.length; i++) {
        var posSpan = items[i].querySelector('.rating-position');
        if (posSpan) posSpan.textContent = i + 1;
    }
}

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(function(s) {
        s.classList.remove('active');
    });
    var t = document.getElementById('screen-' + id);
    if (t) {
        t.classList.add('active', 'bounce-in');
        setTimeout(function() { t.classList.remove('bounce-in'); }, 500);
    }
}

function showToast(m) {
    var t = document.getElementById('toast');
    t.textContent = m;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2500);
}

function goToLobby() {
    if (waitingInterval) clearInterval(waitingInterval);
    window.parent.postMessage({type: 'go-lobby'}, '*');
}

async function submitRating() {
    if (ratingSubmitted) return;
    
    var order = allPlayers.map(function(p) { return p.name; });
    var submitBtn = document.getElementById('submit-btn');
    submitBtn.disabled = true;
    submitBtn.textContent = '⏳ Отправка...';
    
    try {
        var res = await fetch(SRV + '/api/submit-rating', {
            method: 'POST',
            headers: H,
            body: JSON.stringify({
                session_id: SID,
                user_id: myId,
                rating: order
            })
        });
        var data = await res.json();
        
        if (data.status === 'ok') {
            ratingSubmitted = true;
            showToast('✅ Рейтинг сохранён!');
            showScreen('waiting');
            startWaitingForResults();
        } else {
            showToast('❌ Ошибка');
            submitBtn.disabled = false;
            submitBtn.textContent = '✅ Готово';
        }
    } catch(e) {
        console.error('Submit error:', e);
        showToast('❌ Ошибка соединения');
        submitBtn.disabled = false;
        submitBtn.textContent = '✅ Готово';
    }
}

function startWaitingForResults() {
    if (waitingInterval) clearInterval(waitingInterval);
    
    waitingInterval = setInterval(async function() {
        try {
            var res = await fetch(SRV + '/api/state?session_id=' + SID, {
                headers: {'ngrok-skip-browser-warning': 'true'}
            });
            var state = await res.json();
            
            var ratingsCount = Object.keys(state.ratings || {}).length;
            var total = state.players_count || 3;
            var percent = Math.round(ratingsCount / total * 100);
            
            document.getElementById('waiting-progress').style.width = percent + '%';
            document.getElementById('waiting-text').textContent = 'Готово: ' + ratingsCount + '/' + total;
            
            if (state.phase === 'results') {
                clearInterval(waitingInterval);
                showResults(state);
            }
        } catch(e) { console.error('Waiting poll error:', e); }
    }, 1500);
}

function showResults(state) {
    var scores = state.scores || {};
    var resultsHtml = '<h3>Итоговые очки:</h3>';
    
    var sorted = [];
    for (var name in scores) {
        sorted.push([name, scores[name]]);
    }
    sorted.sort(function(a, b) { return b[1] - a[1]; });
    
    for (var i = 0; i < sorted.length; i++) {
        var medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '🔸';
        resultsHtml += '<p style="margin:8px 0;">' + medal + ' <b>' + escapeHtml(sorted[i][0]) + '</b> — ' + sorted[i][1] + ' очков</p>';
    }
    
    document.getElementById('rating-results').innerHTML = resultsHtml;
    showScreen('results');
}

function finishGame() {
    if (roundFinished) return;
    roundFinished = true;
    
    var finishBtn = document.getElementById('btn-finish');
    if (finishBtn) {
        finishBtn.disabled = true;
        finishBtn.textContent = '⏳ Ожидание...';
    }
    
    window.parent.postMessage({type: 'game-complete', scores: {}}, '*');
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

window.addEventListener('DOMContentLoaded', function() {
    loadGame();
});
</script>
</body>
</html>
