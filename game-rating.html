<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Рейтинг</title><link rel="stylesheet" href="shared.css">
    <style>body{background:transparent;padding:0}.phone-frame{box-shadow:none;border:none;border-radius:0;min-height:auto;max-width:100%}.header{display:none}.content{padding:20px 15px;gap:12px}.draggable-item{background:white;border:var(--border);border-radius:12px;padding:12px 15px;margin-bottom:8px;display:flex;align-items:center;gap:10px;font-family:var(--marker);box-shadow:2px 2px 0 rgba(0,0,0,0.1);user-select:none;touch-action:none;cursor:grab}.draggable-item.moving{opacity:.6;transform:scale(.95)}.drag-handle{font-size:24px;margin-right:5px}.rating-position{font-size:14px;font-weight:bold;background:var(--yellow);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink)}.player-avatar-small{width:35px;height:35px;border-radius:50%;object-fit:cover;border:2px solid var(--ink);background:var(--blue);display:flex;align-items:center;justify-content:center;color:white;font-family:var(--marker);font-size:16px;overflow:hidden}</style>
</head>
<body>
<div class="phone-frame">
<div class="toast" id="toast"></div>
<div class="content">
<div class="screen active" id="screen-rating-task"><h1>📊</h1><h2>Расставь друзей!</h2><p style="font-family:Arial,sans-serif;font-weight:900;" id="rating-prompt">От самого щедрого до самого жадины:</p><ul class="draggable-list" id="rating-list"></ul><button class="btn btn-primary btn-arial" onclick="submitRating()">✅ Готово</button></div>
<div class="screen" id="screen-waiting"><h1>⏳</h1><h2>Ожидание...</h2><p style="font-family:var(--marker);">Другие игроки расставляют</p><div class="progress-doodle"><div class="progress-fill" id="waiting-progress" style="width:33%;"></div></div><p style="font-family:var(--marker);font-size:14px;" id="waiting-text">Готово: 1/3</p></div>
<div class="screen" id="screen-results"><h1>🏆</h1><h2>Результат!</h2><div id="rating-results" style="font-family:var(--marker);text-align:left;width:100%;"></div><button class="btn btn-primary btn-arial" id="btn-finish" onclick="finishGame()">▶ Следующий раунд</button><button class="btn btn-secondary btn-arial" onclick="goToLobby()">← Назад в лобби</button></div>
</div>
</div>
<script>
var p=new URLSearchParams(window.location.search);
var SRV=p.get('server_url')||'https://regroup-lucid-bronco.ngrok-free.dev';
var SID=p.get('session_id')||'test-session';
var myId=p.get('user_id')||'unknown';
var myName=p.get('username')||'Игрок';
var H={'Content-Type':'application/json','ngrok-skip-browser-warning':'true'};

var allPlayers=[],criteria='щедрого',opposite='жадины',roundVoted=false;
async function loadGame(){
    try{
        var r=await fetch(SRV+'/api/state?session_id='+SID,{headers:{'ngrok-skip-browser-warning':'true'}});
        var state=await r.json();
        allPlayers=[];
        for(var uid in state.players){
            allPlayers.push({id:uid,name:state.players[uid].username||uid,avatar:state.players[uid].avatar});
        }
        criteria=state.rating_criteria||'щедрого';
        opposite=criteria==='щедрого'?'жадины':'скучного';
    }catch(e){
        allPlayers=[{id:'p1',name:'Саша'},{id:'p2',name:'Маша'},{id:'p3',name:'Дима'}];
    }
    document.getElementById('rating-prompt').textContent='От самого '+criteria+' до самого '+opposite+':';
    renderList();
}
function renderList(){var list=document.getElementById('rating-list');list.innerHTML=allPlayers.map(function(p,i){var avatarHtml=p.avatar?'<img src="'+p.avatar+'" class="player-avatar-small" alt="'+p.name+'">':'<div class="player-avatar-small">'+(p.name||'?').substr(0,2).toUpperCase()+'</div>';return'<li class="draggable-item" data-index="'+i+'" data-id="'+p.id+'"><span class="rating-position">'+(i+1)+'</span><span class="drag-handle">⋮⋮</span>'+avatarHtml+'<span>'+p.name+'</span></li>';}).join('');setupDrag();}
function setupDrag(){var list=document.getElementById('rating-list'),di=null,sy=0;list.querySelectorAll('.draggable-item').forEach(function(item){item.addEventListener('mousedown',function(e){di=item;sy=e.clientY;item.classList.add('moving');});item.addEventListener('touchstart',function(e){di=item;sy=e.touches[0].clientY;item.classList.add('moving');},{passive:false});});document.addEventListener('mousemove',function(e){if(!di)return;var diff=e.clientY-sy;if(Math.abs(diff)>20){swap(di,diff);sy=e.clientY;}});document.addEventListener('touchmove',function(e){if(!di)return;var diff=e.touches[0].clientY-sy;if(Math.abs(diff)>20){swap(di,diff);sy=e.touches[0].clientY;}},{passive:false});document.addEventListener('mouseup',function(){if(di){di.classList.remove('moving');di=null;}});document.addEventListener('touchend',function(){if(di){di.classList.remove('moving');di=null;}});}
function swap(item,diff){var list=document.getElementById('rating-list'),items=[].slice.call(list.querySelectorAll('.draggable-item')),ci=items.indexOf(item),ti;if(diff>0&&ci<items.length-1)ti=ci+1;else if(diff<0&&ci>0)ti=ci-1;else return;var target=items[ti];if(diff>0)list.insertBefore(item,target.nextSibling);else list.insertBefore(item,target);var temp=allPlayers[ci];allPlayers[ci]=allPlayers[ti];allPlayers[ti]=temp;updatePositions();}
function updatePositions(){document.getElementById('rating-list').querySelectorAll('.draggable-item').forEach(function(item,i){var ps=item.querySelector('.rating-position');if(ps)ps.textContent=i+1;});}
function showScreen(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});var t=document.getElementById('screen-'+id);if(t){t.classList.add('active','bounce-in');setTimeout(function(){t.classList.remove('bounce-in');},500);}}
function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}
function goToLobby(){window.parent.postMessage({type:'go-lobby'},'*');}
async function submitRating(){showToast('✅ Сохранено!');var order=allPlayers.map(function(p){return p.name;});await fetch(SRV+'/api/submit-rating',{method:'POST',headers:H,body:JSON.stringify({session_id:SID,user_id:myId,rating:order})});showScreen('waiting');checkResults();}
async function checkResults(){var iv=setInterval(async function(){var res=await fetch(SRV+'/api/state?session_id='+SID,{headers:{'ngrok-skip-browser-warning':'true'}});var state=await res.json();var ratings=state.ratings||{};var up=Object.keys(ratings).length,total=state.players_count||3;document.getElementById('waiting-progress').style.width=Math.round(up/total*100)+'%';document.getElementById('waiting-text').textContent='Готово: '+up+'/'+total;if(state.phase==='results'){clearInterval(iv);showScreen('results');}},1000);}
function finishGame(){if(roundVoted)return;roundVoted=true;document.getElementById('btn-finish').disabled=true;document.getElementById('btn-finish').textContent='⏳ Ожидание...';var scores={};scores[myName]=3;window.parent.postMessage({type:'game-complete',scores:scores},'*');}
window.addEventListener('DOMContentLoaded',function(){loadGame();});
</script>
</body>
</html>
