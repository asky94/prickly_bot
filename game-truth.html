<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Правда или действие</title><link rel="stylesheet" href="shared.css">
    <style>
        body{background:transparent;padding:0}
        .phone-frame{box-shadow:none;border:none;border-radius:0;min-height:auto;max-width:100%}
        .header{display:none}
        .content{padding:20px 15px;gap:12px}
        .question-box{background:var(--yellow);padding:20px;border-radius:20px;margin:10px 0;text-align:center}
    </style>
</head>
<body>
<div class="phone-frame">
<div class="toast" id="toast"></div>
<div class="content">
<div class="screen active" id="screen-truth-vote">
    <h1>🎯</h1>
    <h2>Правда или действие!</h2>
    <div class="question-box">
        <p style="font-family:Arial,sans-serif;font-weight:900;font-size:18px;" id="truth-question">Загрузка...</p>
    </div>
    <div class="vote-grid" id="truth-grid"></div>
    <button class="btn btn-primary btn-arial" id="vote-btn" onclick="submitTruthVote()">🎯 Голосовать</button>
</div>
<div class="screen" id="screen-waiting">
    <h1>⏳</h1>
    <h2>Ожидание...</h2>
    <p style="font-family:var(--marker);">Другие игроки голосуют</p>
    <div class="progress-doodle"><div class="progress-fill" id="waiting-progress" style="width:33%;"></div></div>
    <p style="font-family:var(--marker);font-size:14px;" id="waiting-text">Готово: 1/3</p>
</div>
<div class="screen" id="screen-results">
    <h1>🏆</h1>
    <h2>Результат!</h2>
    <p id="result-text" style="font-family:var(--marker);"></p>
    <button class="btn btn-primary btn-arial" id="btn-finish" onclick="finishGame()">▶ Следующий раунд</button>
    <button class="btn btn-secondary btn-arial" onclick="goToLobby()">← Назад в лобби</button>
</div>
</div>
</div>

<script>
var p = new URLSearchParams(window.location.search);
var SRV = p.get('server_url') || 'https://regroup-lucid-bronco.ngrok-free.dev';
var SID = p.get('session_id') || 'test-session';
var myId = p.get('user_id') || 'unknown';
var myName = p.get('username') || 'Игрок';
var H = {'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true'};

var allPlayers = [];
var truthQuestion = '';
var myVote = null;
var victimId = null;
var roundFinished = false;
var waitingInterval = null;

async function loadGame() {
    try {
        var r = await fetch(SRV + '/api/state?session_id=' + SID, {
            headers: {'ngrok-skip-browser-warning': 'true'}
        });
        var state = await r.json();
        
        allPlayers = [];
        for (var uid in state.players) {
            allPlayers.push({
                id: uid,
                name: state.players[uid].username || uid,
                avatar: state.players[uid].avatar
            });
        }
        
        truthQuestion = state.who_quote || 'Кто из вас пел в душе?';
    } catch(e) {
        allPlayers = [{id: 'p1', name: 'Саша'}, {id: 'p2', name: 'Маша'}, {id: 'p3', name: 'Дима'}];
        truthQuestion = 'Кто из вас пел в душе?';
    }
    
    document.getElementById('truth-question').textContent = truthQuestion;
    renderCards();
}

function renderCards() {
    var grid = document.getElementById('truth-grid');
    grid.innerHTML = '';
    
    for (var i = 0; i < allPlayers.length; i++) {
        var p = allPlayers[i];
        
        var avatarHtml = p.avatar ?
            '<img src="' + p.avatar + '" style="width:50px;height:50px;border-radius:50%;object-fit:cover;border:2px solid var(--ink);margin-bottom:5px;">' :
            '<div style="width:50px;height:50px;border-radius:50%;background:#457B9D;display:flex;align-items:center;justify-content:center;font-size:24px;color:white;font-family:var(--marker);margin-bottom:5px;">' + (p.name || '?').substr(0, 2).toUpperCase() + '</div>';
        
        var card = document.createElement('div');
        card.className = 'vote-card';
        card.setAttribute('data-player', p.id);
        card.innerHTML = avatarHtml + '<p style="font-family:var(--marker);">' + escapeHtml(p.name) + '</p>';
        card.onclick = (function(id) {
            return function() { selectVote(id); };
        })(p.id);
        
        grid.appendChild(card);
    }
}

function selectVote(id) {
    document.querySelectorAll('#truth-grid .vote-card').forEach(function(card) {
        card.classList.remove('selected');
    });
    
    var cards = document.querySelectorAll('#truth-grid .vote-card');
    for (var i = 0; i < cards.length; i++) {
        if (cards[i].getAttribute('data-player') === id) {
            cards[i].classList.add('selected');
            break;
        }
    }
    
    myVote = id;
    showToast('✅ Выбран: ' + (allPlayers.find(p => p.id === id)?.name || id));
}

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(function(s) {
        s.classList.remove('active');
    });
    var t = document.getElementById('screen-' + id);
    if (t) {
        t.classList.add('active', 'bounce-in');
        setTimeout(function() { t.classList.remove('bounce-in'); }, 500);
    }
}

function showToast(m) {
    var t = document.getElementById('toast');
    t.textContent = m;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2500);
}

function goToLobby() {
    if (waitingInterval) clearInterval(waitingInterval);
    window.parent.postMessage({type: 'go-lobby'}, '*');
}

async function submitTruthVote() {
    if (!myVote) {
        showToast('⚠ Выбери игрока!');
        return;
    }
    
    var voteBtn = document.getElementById('vote-btn');
    voteBtn.disabled = true;
    voteBtn.textContent = '⏳ Отправка...';
    
    try {
        var res = await fetch(SRV + '/api/vote', {
            method: 'POST',
            headers: H,
            body: JSON.stringify({
                session_id: SID,
                user_id: myId,
                voted_for: myVote,
                game: 'truth_victim'
            })
        });
        var data = await res.json();
        
        if (data.status === 'ok') {
            showToast('✅ Голос учтён!');
            showScreen('waiting');
            startWaitingForVictim();
        } else {
            showToast('❌ Ошибка');
            voteBtn.disabled = false;
            voteBtn.textContent = '🎯 Голосовать';
        }
    } catch(e) {
        console.error('Vote error:', e);
        showToast('❌ Ошибка соединения');
        voteBtn.disabled = false;
        voteBtn.textContent = '🎯 Голосовать';
    }
}

function startWaitingForVictim() {
    if (waitingInterval) clearInterval(waitingInterval);
    
    waitingInterval = setInterval(async function() {
        try {
            var res = await fetch(SRV + '/api/state?session_id=' + SID, {
                headers: {'ngrok-skip-browser-warning': 'true'}
            });
            var state = await res.json();
            
            var votesCount = Object.keys(state.votes?.truth_victim || {}).length;
            var total = state.players_count || 3;
            var percent = Math.round(votesCount / total * 100);
            
            document.getElementById('waiting-progress').style.width = percent + '%';
            document.getElementById('waiting-text').textContent = 'Готово: ' + votesCount + '/' + total;
            
            if (state.victim) {
                clearInterval(waitingInterval);
                victimId = state.victim;
                showResultsForTruth(state);
            }
        } catch(e) { console.error('Waiting poll error:', e); }
    }, 1500);
}

function showResultsForTruth(state) {
    var victimName = state.victim_name || 'Игрок';
    var resultText = '';
    
    if (String(myId) === String(victimId)) {
        resultText = '🎯 Тебя выбрали! ' + victimName + ', ты получаешь +3 очка за честность!';
    } else {
        resultText = '🎯 Жертвой стал(а) ' + victimName + '!';
    }
    
    document.getElementById('result-text').innerHTML = resultText;
    showScreen('results');
}

function finishGame() {
    if (roundFinished) return;
    roundFinished = true;
    
    var finishBtn = document.getElementById('btn-finish');
    if (finishBtn) {
        finishBtn.disabled = true;
        finishBtn.textContent = '⏳ Ожидание...';
    }
    
    var scores = {};
    if (String(myId) === String(victimId)) {
        scores[myName] = 3;
    }
    
    window.parent.postMessage({type: 'game-complete', scores: scores}, '*');
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

window.addEventListener('DOMContentLoaded', function() {
    loadGame();
});
</script>
</body>
</html>
