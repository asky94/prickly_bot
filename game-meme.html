<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Мем-баттл</title><link rel="stylesheet" href="shared.css">
    <style>body{background:transparent;padding:0}.phone-frame{box-shadow:none;border:none;border-radius:0;min-height:auto;max-width:100%}.header{display:none}.content{padding:20px 15px;gap:12px}.meme-template{width:100%;max-width:300px;height:250px;background:#ddd;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:60px;border:var(--border);overflow:hidden;margin:0 auto}#meme-text{width:100%;padding:12px;font-family:var(--marker);font-size:18px;border-radius:10px;border:2px solid var(--ink);text-align:center}.meme-result-img{width:100%;max-width:300px;height:250px;border-radius:15px;object-fit:cover;border:var(--border);margin:10px auto;display:block}.big-text{font-size:18px;font-weight:bold;color:var(--ink);line-height:1.4}</style>
</head>
<body>
<div class="phone-frame">
<div class="toast" id="toast"></div>
<div class="content">
<div class="screen active" id="screen-meme-create"><h1>🎭</h1><h2>Мем-баттл!</h2><div class="meme-template" id="meme-img">🖼</div><p style="font-family:Arial,sans-serif;font-weight:900;">Придумай подпись:</p><input type="text" id="meme-text" placeholder="Твоя подпись..."><button class="btn btn-primary btn-arial" onclick="submitMeme()">📝 Отправить</button><p id="meme-status" style="font-family:var(--marker);color:var(--green);"></p></div>
<div class="screen" id="screen-waiting"><h1>⏳</h1><h2>Ожидание...</h2><p style="font-family:var(--marker);">Другие игроки придумывают подписи</p><div class="progress-doodle"><div class="progress-fill" id="waiting-progress" style="width:33%;"></div></div><p style="font-family:var(--marker);font-size:14px;" id="waiting-text">Готово: 1/3</p></div>
<div class="screen" id="screen-vote"><h1>🗳</h1><h2>Лучший мем!</h2><img class="meme-result-img" id="vote-meme-img" src="" alt="Мем"><div class="vote-grid" id="vote-grid"></div><button class="btn btn-primary btn-arial" onclick="submitVote()">✅ Голосовать</button></div>
<div class="screen" id="screen-results"><h1>🏆</h1><h2>Победитель!</h2><img class="meme-result-img" id="result-meme-img" src="" alt="Мем"><p style="font-family:var(--marker);">🥇 <b id="winner-name">...</b></p><p class="big-text" id="winner-text">...</p><button class="btn btn-primary btn-arial" id="btn-finish" onclick="finishGame()">▶ Следующий раунд</button><button class="btn btn-secondary btn-arial" onclick="goToLobby()">← Назад в лобби</button></div>
</div>
</div>
<script>
var p=new URLSearchParams(window.location.search);
var SRV=p.get('server_url')||'https://regroup-lucid-bronco.ngrok-free.dev';
var SID=p.get('session_id')||'test-session';
var myId=p.get('user_id')||'unknown';
var myName=p.get('username')||'Игрок';
var H={'Content-Type':'application/json','ngrok-skip-browser-warning':'true'};

var memeTexts={},players={},memeImage='',selectedVote=null,roundVoted=false;
var FALLBACK_MEMES=['https://i.imgflip.com/1bij.jpg','https://i.imgflip.com/30b1gx.jpg','https://i.imgflip.com/1g8my4.jpg'];
async function loadGame(){
    try{
        var r=await fetch(SRV+'/api/state?session_id='+SID,{headers:{'ngrok-skip-browser-warning':'true'}});
        var s=await r.json();
        memeImage=s.meme_image||'';
        var memeImg=document.getElementById('meme-img');
        if(memeImage){
            memeImg.innerHTML='<img src="'+memeImage+'" style="width:100%;height:100%;object-fit:cover;">';
        }
    }catch(e){
        document.getElementById('meme-img').innerHTML='🖼';
    }
}

function showScreen(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});var t=document.getElementById('screen-'+id);if(t){t.classList.add('active','bounce-in');setTimeout(function(){t.classList.remove('bounce-in');},500);}}
function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}
function goToLobby(){window.parent.postMessage({type:'go-lobby'},'*');}
async function submitMeme(){var text=document.getElementById('meme-text').value.trim();if(!text){showToast('⚠ Напиши подпись!');return;}document.getElementById('meme-status').textContent='✅ Отправлено!';await fetch(SRV+'/api/submit-meme',{method:'POST',headers:H,body:JSON.stringify({session_id:SID,user_id:myId,text:text})});showScreen('waiting');checkAnswers();}
async function checkAnswers(){var iv=setInterval(async function(){var res=await fetch(SRV+'/api/state?session_id='+SID,{headers:{'ngrok-skip-browser-warning':'true'}});var state=await res.json();memeTexts=state.meme_texts||{};players=state.players||{};var up=Object.keys(memeTexts).length,total=state.players_count||3;document.getElementById('waiting-progress').style.width=Math.round(up/total*100)+'%';document.getElementById('waiting-text').textContent='Готово: '+up+'/'+total;if(state.phase==='voting'||up>=total){clearInterval(iv);renderVoteGrid();showScreen('vote');}},2000);}
function renderVoteGrid(){var g=document.getElementById('vote-grid');g.innerHTML='';document.getElementById('vote-meme-img').src=memeImage;var keys=Object.keys(memeTexts);for(var i=0;i<keys.length;i++){var uid=keys[i],p=memeTexts[uid],name=p.username||uid;g.innerHTML+='<div class="vote-card" data-player="'+uid+'" onclick="'+ (uid===myId?'showToast(\'⚠ За себя нельзя!\')':'selectVote(\''+uid+'\')') +'"><p style="font-family:var(--marker);font-size:14px;">'+name+'</p><p class="big-text">«'+p.text+'»</p></div>';}}
function selectVote(uid){document.querySelectorAll('#vote-grid .vote-card').forEach(function(c){c.classList.remove('selected');});var cards=document.querySelectorAll('#vote-grid .vote-card');for(var i=0;i<cards.length;i++){if(cards[i].dataset.player===uid)cards[i].classList.add('selected');}selectedVote=uid;}
async function submitVote(){if(!selectedVote){showToast('⚠ Выбери!');return;}var res=await fetch(SRV+'/api/vote',{method:'POST',headers:H,body:JSON.stringify({session_id:SID,user_id:myId,voted_for:selectedVote,game:'meme'})});var data=await res.json();if(data.status==='error'){showToast('⚠ '+data.message);return;}if(data.all_voted){showResults(data.winner_name);}else{showToast('✅ Выбор сделан! Ожидаем других...');var ci=setInterval(async function(){var sr=await fetch(SRV+'/api/state?session_id='+SID,{headers:{'ngrok-skip-browser-warning':'true'}});var s=await sr.json();if(s.all_voted||s.phase==='results'){clearInterval(ci);showResults(s.winner_name);}},1500);}}
function showResults(winnerName){document.getElementById('winner-name').textContent=winnerName||'Неизвестный игрок';document.getElementById('result-meme-img').src=memeImage;var wp=memeTexts[Object.keys(memeTexts).find(function(k){return memeTexts[k].username===winnerName;})];document.getElementById('winner-text').textContent='«'+(wp?wp.text:'')+'»';showScreen('results');}
function finishGame(){if(roundVoted)return;roundVoted=true;document.getElementById('btn-finish').disabled=true;document.getElementById('btn-finish').textContent='⏳ Ожидание...';var scores={};if(memeTexts[selectedVote])scores[memeTexts[selectedVote].username||selectedVote]=5;window.parent.postMessage({type:'game-complete',scores:scores},'*');}
window.addEventListener('DOMContentLoaded',function(){loadGame();});
</script>
</body>
</html>
