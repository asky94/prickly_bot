<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ассоциации</title><link rel="stylesheet" href="shared.css">
    <style>
        body{background:transparent;padding:0}
        .phone-frame{box-shadow:none;border:none;border-radius:0;min-height:auto;max-width:100%}
        .header{display:none}
        .content{padding:20px 15px;gap:12px}
        #assoc-input{width:100%;padding:12px;font-family:var(--marker);font-size:18px;border-radius:10px;border:2px solid var(--ink);text-align:center}
        .big-text{font-size:18px;font-weight:bold;color:var(--ink);line-height:1.4}
        .assoc-word{background:var(--yellow);display:inline-block;padding:4px 12px;border-radius:15px;border:2px dashed var(--ink)}
    </style>
</head>
<body>
<div class="phone-frame">
<div class="toast" id="toast"></div>
<div class="content">
<div class="screen active" id="screen-assoc-create">
    <h1>💭</h1>
    <h2>Ассоциации!</h2>
    <p style="font-family:Arial,sans-serif;font-weight:900;">Тема: <b id="assoc-word" class="assoc-word">...</b></p>
    <input type="text" id="assoc-input" placeholder="Твоя ассоциация..." maxlength="100">
    <button class="btn btn-primary btn-arial" id="submit-btn" onclick="submitAssoc()">📝 Отправить</button>
    <p id="assoc-status" style="font-family:var(--marker);color:var(--green);"></p>
</div>
<div class="screen" id="screen-waiting">
    <h1>⏳</h1>
    <h2>Ожидание...</h2>
    <p style="font-family:var(--marker);">Другие игроки пишут ассоциации</p>
    <div class="progress-doodle"><div class="progress-fill" id="waiting-progress" style="width:33%;"></div></div>
    <p style="font-family:var(--marker);font-size:14px;" id="waiting-text">Готово: 1/3</p>
</div>
<div class="screen" id="screen-vote">
    <h1>🗳</h1>
    <h2>Чья ассоциация лучше?</h2>
    <p style="font-family:var(--marker);margin-bottom:10px;">Тема: <b id="vote-assoc-word" class="assoc-word">...</b></p>
    <div class="vote-grid" id="vote-grid"></div>
    <button class="btn btn-primary btn-arial" id="vote-btn" onclick="submitVote()">✅ Голосовать</button>
</div>
<div class="screen" id="screen-results">
    <h1>🏆</h1>
    <h2>Победитель!</h2>
    <p style="font-family:var(--marker);">🥇 <b id="winner-name">...</b></p>
    <p class="big-text" id="winner-text">...</p>
    <p style="font-family:var(--marker);color:var(--prickle);" id="assoc-theme-display"></p>
    <button class="btn btn-primary btn-arial" id="btn-finish" onclick="finishGame()">▶ Следующий раунд</button>
    <button class="btn btn-secondary btn-arial" onclick="goToLobby()">← Назад в лобби</button>
</div>
</div>
</div>

<script>
var p = new URLSearchParams(window.location.search);
var SRV = p.get('server_url') || 'https://regroup-lucid-bronco.ngrok-free.dev';
var SID = p.get('session_id') || 'test-session';
var myId = p.get('user_id') || 'unknown';
var myName = p.get('username') || 'Игрок';
var H = {'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true'};

var assocWord = '';
var assocTexts = {};
var players = {};
var selectedVote = null;
var roundFinished = false;
var waitingInterval = null;

async function loadTask() {
    try {
        var r = await fetch(SRV + '/api/task?session_id=' + SID + '&game_type=assoc&user_id=' + myId, {
            headers: {'ngrok-skip-browser-warning': 'true'}
        });
        var d = await r.json();
        assocWord = d.task || 'Лень';
    } catch(e) {
        assocWord = 'Лень';
    }
    document.getElementById('assoc-word').textContent = assocWord;
}

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(function(s) {
        s.classList.remove('active');
    });
    var t = document.getElementById('screen-' + id);
    if (t) {
        t.classList.add('active', 'bounce-in');
        setTimeout(function() { t.classList.remove('bounce-in'); }, 500);
    }
}

function showToast(m) {
    var t = document.getElementById('toast');
    t.textContent = m;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2500);
}

function goToLobby() {
    if (waitingInterval) clearInterval(waitingInterval);
    window.parent.postMessage({type: 'go-lobby'}, '*');
}

async function submitAssoc() {
    var text = document.getElementById('assoc-input').value.trim();
    if (!text) {
        showToast('⚠ Напиши ассоциацию!');
        return;
    }
    
    var btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = '⏳ Отправка...';
    
    try {
        var res = await fetch(SRV + '/api/submit-assoc', {
            method: 'POST',
            headers: H,
            body: JSON.stringify({
                session_id: SID,
                user_id: myId,
                text: text
            })
        });
        var data = await res.json();
        
        if (data.status === 'ok') {
            document.getElementById('assoc-status').textContent = '✅ Отправлено! Ожидаем других...';
            showToast('✅ Ассоциация отправлена!');
            showScreen('waiting');
            startWaitingForSubmissions();
        } else {
            showToast('❌ Ошибка');
            btn.disabled = false;
            btn.textContent = '📝 Отправить';
        }
    } catch(e) {
        console.error('Submit error:', e);
        showToast('❌ Ошибка соединения');
        btn.disabled = false;
        btn.textContent = '📝 Отправить';
    }
}

function startWaitingForSubmissions() {
    if (waitingInterval) clearInterval(waitingInterval);
    
    waitingInterval = setInterval(async function() {
        try {
            var res = await fetch(SRV + '/api/state?session_id=' + SID, {
                headers: {'ngrok-skip-browser-warning': 'true'}
            });
            var state = await res.json();
            
            assocTexts = state.assoc_texts || {};
            players = state.players || {};
            var submittedCount = Object.keys(assocTexts).length;
            var total = state.players_count || 3;
            var percent = Math.round(submittedCount / total * 100);
            
            document.getElementById('waiting-progress').style.width = percent + '%';
            document.getElementById('waiting-text').textContent = 'Готово: ' + submittedCount + '/' + total;
            
            if (state.phase === 'voting' || submittedCount >= total) {
                clearInterval(waitingInterval);
                renderVoteGrid();
                showScreen('vote');
            }
        } catch(e) { console.error('Waiting poll error:', e); }
    }, 1500);
}

function renderVoteGrid() {
    var grid = document.getElementById('vote-grid');
    grid.innerHTML = '';
    document.getElementById('vote-assoc-word').textContent = assocWord;
    
    var keys = Object.keys(assocTexts);
    if (keys.length === 0) {
        grid.innerHTML = '<p style="font-family:var(--marker);text-align:center;">Нет ассоциаций для голосования</p>';
        return;
    }
    
    for (var i = 0; i < keys.length; i++) {
        var uid = keys[i];
        var p = assocTexts[uid];
        var name = p.username || uid;
        var isSelf = (uid === myId);
        
        var card = document.createElement('div');
        card.className = 'vote-card';
        card.setAttribute('data-player', uid);
        card.style.cursor = isSelf ? 'not-allowed' : 'pointer';
        card.style.opacity = isSelf ? '0.6' : '1';
        card.innerHTML = '<p style="font-family:var(--marker);font-size:16px;font-weight:bold;">' + escapeHtml(name) + '</p>' +
                        '<p class="big-text" style="font-size:16px;">«' + escapeHtml(p.text) + '»</p>';
        
        if (!isSelf) {
            card.onclick = (function(id) { 
                return function() { selectVote(id); };
            })(uid);
        } else {
            card.onclick = function() { showToast('⚠ Нельзя голосовать за себя!'); };
        }
        
        grid.appendChild(card);
    }
}

function selectVote(uid) {
    document.querySelectorAll('#vote-grid .vote-card').forEach(function(card) {
        card.classList.remove('selected');
    });
    
    var cards = document.querySelectorAll('#vote-grid .vote-card');
    for (var i = 0; i < cards.length; i++) {
        if (cards[i].getAttribute('data-player') === uid) {
            cards[i].classList.add('selected');
            break;
        }
    }
    
    selectedVote = uid;
    showToast('✅ Выбрана ассоциация ' + (assocTexts[uid]?.username || uid));
}

async function submitVote() {
    if (!selectedVote) {
        showToast('⚠ Выбери лучшую ассоциацию!');
        return;
    }
    
    var voteBtn = document.getElementById('vote-btn');
    voteBtn.disabled = true;
    voteBtn.textContent = '⏳ Отправка...';
    
    try {
        var res = await fetch(SRV + '/api/vote', {
            method: 'POST',
            headers: H,
            body: JSON.stringify({
                session_id: SID,
                user_id: myId,
                voted_for: selectedVote,
                game: 'assoc'
            })
        });
        var data = await res.json();
        
        if (data.status === 'error') {
            showToast('⚠ ' + (data.message || 'Ошибка'));
            voteBtn.disabled = false;
            voteBtn.textContent = '✅ Голосовать';
            return;
        }
        
        showToast('✅ Голос учтён!');
        
        if (data.all_voted || data.phase === 'results') {
            await waitForWinner();
        } else {
            voteBtn.textContent = '⏳ Ожидание...';
            await waitForWinner();
        }
    } catch(e) {
        console.error('Vote error:', e);
        showToast('❌ Ошибка');
        voteBtn.disabled = false;
        voteBtn.textContent = '✅ Голосовать';
    }
}

async function waitForWinner() {
    var interval = setInterval(async function() {
        try {
            var res = await fetch(SRV + '/api/state?session_id=' + SID, {
                headers: {'ngrok-skip-browser-warning': 'true'}
            });
            var state = await res.json();
            
            if (state.phase === 'results' && state.winner_name) {
                clearInterval(interval);
                showResults(state.winner_name);
            }
        } catch(e) { console.error('Results poll error:', e); }
    }, 1500);
}

function showResults(winnerName) {
    var displayName = winnerName || 'Неизвестный игрок';
    document.getElementById('winner-name').textContent = displayName;
    
    // Находим текст победителя
    var winnerText = '';
    for (var uid in assocTexts) {
        if (assocTexts[uid].username === winnerName) {
            winnerText = assocTexts[uid].text;
            break;
        }
    }
    
    document.getElementById('winner-text').textContent = winnerText ? '«' + winnerText + '»' : '...';
    document.getElementById('assoc-theme-display').textContent = 'Тема: ' + assocWord;
    showScreen('results');
}

function finishGame() {
    if (roundFinished) return;
    roundFinished = true;
    
    var finishBtn = document.getElementById('btn-finish');
    if (finishBtn) {
        finishBtn.disabled = true;
        finishBtn.textContent = '⏳ Ожидание...';
    }
    
    var winnerName = document.getElementById('winner-name').textContent;
    var scores = {};
    if (winnerName && winnerName !== 'Неизвестный игрок') {
        scores[winnerName] = 5;
    }
    
    window.parent.postMessage({type: 'game-complete', scores: scores}, '*');
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

window.addEventListener('DOMContentLoaded', async function() {
    await loadTask();
});
</script>
</body>
</html>
