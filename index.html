<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Prickly Fuss 🦔</title>
    <link rel="icon" type="image/jpeg" href="LogoGame.jpg">
    <link rel="stylesheet" href="shared.css">
    <style>#game-container{position:absolute;top:0;left:0;width:100%;height:100%;z-index:10;display:none;background:var(--paper)}#game-container.active{display:block}#game-frame{width:100%;height:100%;border:none}</style>
</head>
<body>
<div class="phone-frame" id="app">
    <div class="splash-overlay" id="splashScreen"><img src="LogoGame.jpg" alt="Prickly Fuss" class="splash-logo" id="splashLogo"><div class="splash-progress"><div class="splash-progress-fill"></div></div></div>
    <div class="header"><span class="logo">🦔 Prickly Fuss</span><span class="round-badge" id="round-badge">Раунд 1/3</span></div>
    <div class="toast" id="toast"></div>
    <div id="game-container"><iframe id="game-frame" src="" allow="camera;microphone"></iframe></div>
    <div class="content" id="content">
        <div class="screen active" id="screen-enter"><h1>🦔</h1><h2>Prickly Fuss</h2><p>Колючая суета начинается!</p><button class="btn btn-primary btn-arial" onclick="enterGame()">🎮 ЗАЙТИ В ИГРУ</button></div>
        <div class="screen" id="screen-lobby"><h1>👥</h1><h2>Ожидание игроков</h2><p class="doodle-text" id="lobby-count">0/8 готовы</p><div class="player-list" id="player-list"></div><button class="btn btn-primary btn-arial" id="btn-start-game" disabled onclick="startSlotMachine()">▶ ИГРАТЬ (минимум 3)</button></div>
        <div class="screen" id="screen-scoreboard"><h1>📊</h1><h2>Турнирная таблица</h2><div id="scoreboard-content"></div></div>
    </div>
</div>
<div class="avatar-modal" id="avatarModal"><h2 style="color:white;">📸 Сделай селфи!</h2><div class="avatar-circle" id="avatarCircle" onclick="document.getElementById('avatar-camera-input').click()">📷</div><input type="file" id="avatar-camera-input" accept="image/*" capture="environment" onchange="handleAvatarUpload(event)" style="display:none;"><button class="btn btn-primary btn-arial" onclick="confirmAvatar()">✅ Сохранить</button></div>
<script>
var myUserId, myUsername, myAvatarData=null;
var SRV='https://regroup-lucid-bronco.ngrok-free.dev', SID='test-session';
var gameStarted=false, lobbyPollInterval=null;

sessionStorage.setItem('server_url',SRV);
sessionStorage.setItem('session_id',SID);

if(window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.initDataUnsafe&&window.Telegram.WebApp.initDataUnsafe.user){
    var user=window.Telegram.WebApp.initDataUnsafe.user;
    myUsername=user.first_name||user.username||'Игрок';
    myUserId='tg_'+user.id;
}else{
    myUsername=prompt('Введи имя','Игрок')||'Игрок';
    myUserId='player_'+myUsername.toLowerCase().replace(/\s/g,'_');
}
sessionStorage.setItem('user_id',myUserId);
sessionStorage.setItem('username',myUsername);

window.addEventListener('DOMContentLoaded',function(){
    setTimeout(function(){
        document.getElementById('splashScreen').classList.add('hidden');
        showScreen('enter');
    },3000);
});

function showScreen(id){
    document.querySelectorAll('#content .screen').forEach(function(s){s.classList.remove('active');});
    var t=document.getElementById('screen-'+id);
    if(t)t.classList.add('active');
}
function showToast(m){
    var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
    setTimeout(function(){t.classList.remove('show');},2500);
}
function enterGame(){
    if(!myAvatarData){document.getElementById('avatarModal').classList.add('active');}
    else{showScreen('lobby');joinServer().then(function(){pollLobby();});}
}
function handleAvatarUpload(e){
    var f=e.target.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(ev){myAvatarData=ev.target.result;document.getElementById('avatarCircle').innerHTML='<img src="'+myAvatarData+'" alt="Аватар">';};
    r.readAsDataURL(f);
}
function confirmAvatar(){
    document.getElementById('avatarModal').classList.remove('active');
    showScreen('lobby');joinServer().then(function(){pollLobby();});
}

async function joinServer(){
    try{
        var r=await fetch(SRV+'/api/join',{
            method:'POST',
            headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'true'},
            body:JSON.stringify({user_id:myUserId,username:myUsername,session_id:SID})
        });
        return await r.json();
    }catch(e){return{status:'ok',players_count:1};}
}

async function checkState(){
    try{
        var r=await fetch(SRV+'/api/state?session_id='+SID,{headers:{'ngrok-skip-browser-warning':'true'}});
        return await r.json();
    }catch(e){return{phase:'lobby',players_count:1};}
}

function pollLobby(){
    if(lobbyPollInterval)clearInterval(lobbyPollInterval);
    lobbyPollInterval=setInterval(async function(){
        var s=await checkState(),c=s.players_count||0;
        document.getElementById('lobby-count').textContent=c+'/8 готовы';
        var b=document.getElementById('btn-start-game');
        if(c>=3&&!gameStarted){b.disabled=false;b.textContent='▶ ИГРАТЬ';}
    },2000);
}

function startSlotMachine(){
    gameStarted=true;
    document.getElementById('btn-start-game').disabled=true;
    document.getElementById('btn-start-game').textContent='Запуск...';
    fetch(SRV+'/api/start',{
        method:'POST',
        headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'true'},
        body:JSON.stringify({session_id:SID})
    }).then(function(r){return r.json();}).then(function(d){console.log('Игра запущена:',d);});
}
</script>
</body>
</html>
